<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="880" height="124" viewBox="0 0 880 124" role="img" aria-label="Latest news">
  <style><![CDATA[
    text { font: 15px 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial,
                 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .m { fill: #58a6ff; }
    .s { fill: #8b949e; }
    .y { fill: #3fb950; }
    .track { animation: roll 78s linear infinite; }
    @keyframes roll {
      from { transform: translateY(0); }
      to   { transform: translateY(-750px); }
    }
    @media (prefers-reduced-motion: reduce) { .track { animation: none; } }
  ]]></style>

  <defs>
    <clipPath id="view"><rect x="0" y="0" width="880" height="124" rx="8"/></clipPath>

