name: Refresh announcement timestamp

on:
  schedule:
    - cron: '0 22 * * *'   # 每天 UTC 22:00 = 北京时间 06:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Rewrite dates
        run: |
          NOW=$(TZ=Asia/Shanghai date +%F)
          FROM=$(TZ=Asia/Shanghai date -d '-3 months' +%F)
          sed -i "s|<!--NOW-->[^<]*<!--/NOW-->|<!--NOW-->${NOW}<!--/NOW-->|g" README.md
          sed -i "s|<!--FROM-->[^<]*<!--/FROM-->|<!--FROM-->${FROM}<!--/FROM-->|g" README.md
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: refresh announcement timestamp" || exit 0
          git push
